name: Publish to PyPI

# Releases are cut by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Publishing uses PyPI Trusted Publishing (OIDC) -- there is no API token stored
# in this repository. Two distributions are built from this one repo:
#   * lindwyrm -- the real package
#   * lwyrm    -- an alias metapackage that just depends on lindwyrm
# They are uploaded by separate jobs so each upload contains exactly one
# project's artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build lindwyrm
        run: python -m build --outdir dist/lindwyrm .

      - name: Build lwyrm alias
        run: python -m build --outdir dist/lwyrm packaging/lwyrm

      - name: Show what was built
        run: ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/

  publish-lindwyrm:
    needs: build
    runs-on: ubuntu-latest
    # Each PyPI project needs its OWN environment name: a pending trusted
    # publisher must be unique across owner + repo + workflow + environment,
    # so two projects sharing one environment cannot both be registered.
    environment: pypi-lindwyrm
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/lindwyrm

  publish-lwyrm:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-lwyrm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/lwyrm
