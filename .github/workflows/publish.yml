name: Publish to PyPI

# Releases are cut by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Publishing uses PyPI Trusted Publishing (OIDC) -- there is no API token stored
# in this repository. Two distributions are built from this one repo:
#   * lindwyrm -- the real package
#   * lwyrm    -- an alias metapackage that just depends on lindwyrm
# They are uploaded by separate jobs so each upload contains exactly one
# project's artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A release must not go out on a red suite. Reused rather than duplicated,
  # so the release runs exactly the tests that guard every push.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      # A tag that doesn't match the version in the code builds the wrong
      # commit's contents. With skip-existing on the upload that failure is
      # silent -- the run goes green and publishes nothing -- so it is caught
      # loudly here instead, before anything is built.
      - name: Check the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          code = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path("lindwyrm/__init__.py").read_text(),
          ).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{code}"

          if tag != expected:
              sys.exit(
                  f"::error::Tag {tag} does not match the version in "
                  f"lindwyrm/__init__.py ({code}); expected the tag to be "
                  f"{expected}. Either the version bump was not committed "
                  f"before tagging, or the tag points at an older commit. "
                  f"Move the tag to the commit that bumps the version, or cut "
                  f"a new version -- a version already on PyPI cannot be "
                  f"re-uploaded."
              )
          print(f"tag {tag} matches version {code}")
          PY

      # lindwyrm/__init__.py is the single source of truth for the version.
      # The alias package builds from its own directory and can't read it, so
      # the value is stamped in here instead of being maintained by hand.
      - name: Sync alias version with lindwyrm
        run: |
          python - <<'PY'
          import pathlib, re
          version = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path("lindwyrm/__init__.py").read_text(),
          ).group(1)
          alias = pathlib.Path("packaging/lwyrm/pyproject.toml")
          text = alias.read_text()
          text = re.sub(r'^version = ".*"$', f'version = "{version}"',
                        text, count=1, flags=re.M)
          text = re.sub(r'lindwyrm>=[0-9][^"]*', f'lindwyrm>={version}', text)
          alias.write_text(text)
          print(f"stamped alias package with version {version}")
          PY

      - name: Build lindwyrm
        run: python -m build --outdir dist/lindwyrm .

      - name: Build lwyrm alias
        run: python -m build --outdir dist/lwyrm packaging/lwyrm

      - name: Show what was built
        run: ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/

  publish-lindwyrm:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/lindwyrm
          # A version already on PyPI can never be re-uploaded. Skipping instead
          # of failing keeps re-runs of a tag idempotent -- needed whenever one
          # of the two projects published successfully and the other did not.
          skip-existing: true

  publish-lwyrm:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/lwyrm
          skip-existing: true
