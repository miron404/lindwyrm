[project]
name = "lindwyrm"
dynamic = ["version"]
description = "A minimal, dependency-light CLI coding agent for any Anthropic- or OpenAI-compatible provider"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["cli", "coding-agent", "llm", "anthropic", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/miron404/lindwyrm"
Source = "https://github.com/miron404/lindwyrm"
Issues = "https://github.com/miron404/lindwyrm/issues"

[project.scripts]
lwyrm = "lindwyrm.cli:main"
lindwyrm = "lindwyrm.cli:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license fields
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lindwyrm"]

# Single source of truth for the version: lindwyrm/__init__.py.
# packaging/lwyrm/pyproject.toml reads the same value at build time.
[tool.setuptools.dynamic]
version = {attr = "lindwyrm.__version__"}
