[project]
name = "lindwyrm"
version = "0.1.0"
description = "A minimal, dependency-light CLI coding agent for any Anthropic- or OpenAI-compatible provider"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
lwyrm = "lindwyrm.cli:main"
lindwyrm = "lindwyrm.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lindwyrm"]
